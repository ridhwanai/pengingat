name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Siapkan keystore dari Secrets (bila ada)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore ditemukan — build ditandatangani keystore tetap."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_B64 kosong — build memakai debug signing."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle :app:assembleRelease --stacktrace \
              -PCI_STORE_FILE="$KEYSTORE_PATH" \
              -PCI_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PCI_KEY_ALIAS="$KEY_ALIAS" \
              -PCI_KEY_PASSWORD="$KEY_PASSWORD"
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pengingat-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
